version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      # Core Configuration
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8000}
      
      # Database
      - MONGODB_URI=${MONGODB_URI}
      
      # Redis
      - REDIS_URL=${REDIS_URL}
      
      # JWT Secrets
      - JWT_SECRET=${JWT_SECRET}
      - APP_USER_JWT_SECRET=${APP_USER_JWT_SECRET}
      - BACKOFFICE_JWT_SECRET=${BACKOFFICE_JWT_SECRET}
      - GENERAL_TOKEN_SECRET=${GENERAL_TOKEN_SECRET}
      
      # FCM Configuration
      - FCM_SERVER_KEY=${FCM_SERVER_KEY}
      
      # Email Configuration
      - ACS_CONNECTION_STRING=${ACS_CONNECTION_STRING}
      - SENDER_EMAIL=${SENDER_EMAIL}
      
      # URLs
      - BACKEND_URL=${BACKEND_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      
      # Environment Colors
      - ENV_COLOR_GREEN=${ENV_COLOR_GREEN}
      - ENV_COLOR_BLUE=${ENV_COLOR_BLUE}
      - ENV_COLOR_YELLOW=${ENV_COLOR_YELLOW}
      - ENV_COLOR_ORANGE=${ENV_COLOR_ORANGE}
      - ENV_COLOR_RED=${ENV_COLOR_RED}
      
      # Application Settings
      - ENV_NUMBER_OF_RECORD_POST_BEFORE_SENDING_AVERAGE_NECK_ANGLE=${ENV_NUMBER_OF_RECORD_POST_BEFORE_SENDING_AVERAGE_NECK_ANGLE}
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - cervitech-network

  mongodb:
    image: mongo:7-alpine
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - cervitech-network

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - cervitech-network

volumes:
  mongodb_data:
  redis_data:

networks:
  cervitech-network:
    driver: bridge
